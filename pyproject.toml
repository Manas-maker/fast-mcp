[project]
name = "mcp-fastapi"
version = "0.1.0"
description = "FastAPI-native Model Context Protocol framework"
readme = "README.md"
authors = [
    { name = "Manas Pradhan", email = "64654573+Manas-maker@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "starlette>=0.35.0",
]

[project.scripts]
fast-mcp = "fast_mcp.cli:main"
mcp-fastapi = "fast_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_mcp"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
