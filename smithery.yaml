# Smithery configuration for mcp-fastapi
# https://smithery.ai/docs/config
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      target:
        type: string
        description: "Python module and target application to expose (e.g. fast_mcp.demo:app or main:app)"
        default: "fast_mcp.demo:app"
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: [
        '--from',
        'mcp-fastapi',
        'fast-mcp',
        'stdio',
        config.target || 'fast_mcp.demo:app'
      ]
    })
